name: Pruebas de DELIA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: pytest y benchmark MX/BO
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener el código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Instalar dependencias de prueba
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip check
      - name: Ejecutar la suite completa
        run: python -m pytest -q --tb=short tests/
      - name: Comprobar escenarios de revisión
        run: |
          python -m benchmarks.check_review_scenarios --contexts --seed 20261111
          python -m benchmarks.check_review_scenarios --contexts --seed 20261112
      - name: Ejecutar los benchmarks sintéticos
        run: |
          python -m benchmarks.evaluate --dataset benchmarks/synthetic_pii_mx_bo.jsonl
          python -m benchmarks.evaluate --dataset benchmarks/synthetic_pii_mx_policy.jsonl
          python -m benchmarks.evaluate --dataset benchmarks/synthetic_pii_r3.jsonl
          python -m benchmarks.evaluate --dataset benchmarks/synthetic_pii_coverage.jsonl
          python -m benchmarks.evaluate --dataset benchmarks/synthetic_pii_contexts.jsonl

  regional-compatibility:
    name: Detectores regionales (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Obtener el código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias de compatibilidad
        run: python -m pip install -r requirements-bootstrap.txt requests==2.34.2
      - name: Comprobar pruebas de detección y consumidor HTTP
        run: >
          python -m pytest -q --tb=short
          tests/test_pii.py tests/test_pii_mx_bo.py tests/test_pii_regressions.py
          tests/test_pii_coverage.py tests/test_pii_contexts.py
          tests/test_replay_session.py tests/test_benchmark.py
      - name: Comprobar contextos generados
        run: python -m benchmarks.check_review_scenarios --contexts --seed 20261112
