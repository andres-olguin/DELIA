name: Pruebas de DELIA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: pytest y benchmark MX/BO
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener el código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Instalar dependencias de prueba
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip check
      - name: Ejecutar la suite completa con cobertura
        id: pytest
        run: |
          mkdir -p ci-reports
          python -m coverage run --branch --source=app,backend -m pytest -q --tb=short --junitxml=ci-reports/pytest.xml tests/
      - name: Generar reportes de cobertura
        if: ${{ !cancelled() && (steps.pytest.outcome == 'success' || steps.pytest.outcome == 'failure') }}
        run: |
          python -m coverage report -m
          python -m coverage xml -o ci-reports/coverage.xml
          python -m coverage json -o ci-reports/coverage.json
      - name: Comprobar escenarios de revisión
        run: |
          python -m benchmarks.check_review_scenarios --contexts --seed 20261111
          python -m benchmarks.check_review_scenarios --contexts --seed 20261112
      - name: Ejecutar los benchmarks sintéticos
        run: |
          mkdir -p ci-reports/benchmarks
          for corpus in mx_bo mx_policy r3 coverage contexts; do
            python -m benchmarks.evaluate \
              --dataset "benchmarks/synthetic_pii_${corpus}.jsonl" \
              --out "ci-reports/benchmarks/${corpus}.json"
          done
      - name: Publicar resultados de pruebas, cobertura y benchmarks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delia-ci-python-3.14.4
          path: |
            ci-reports/pytest.xml
            ci-reports/coverage.xml
            ci-reports/coverage.json
            ci-reports/benchmarks/*.json
          retention-days: 30

  regional-compatibility:
    name: Suite completa (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Obtener el código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test-compat.txt
      - name: Instalar dependencias de compatibilidad
        run: |
          python -m pip install -r requirements-test-compat.txt
          python -m pip check
      - name: Ejecutar la suite completa
        run: python -m pytest -q --tb=short --junitxml=ci-reports/pytest.xml tests/
      - name: Comprobar contextos generados
        run: python -m benchmarks.check_review_scenarios --contexts --seed 20261112
      - name: Publicar resultados de pruebas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delia-ci-python-${{ matrix.python-version }}
          path: ci-reports/pytest.xml
          retention-days: 30
