name: DELIA — Growth Evidence & Media Integrity
on:
  push:
    branches: [main, feat/research-media-growth-2026]
    paths:
      - 'docs/growth/**'
      - 'tools/validate_growth_evidence.py'
      - 'tests/test_growth_evidence.py'
      - '.github/workflows/growth-evidence-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/growth/**'
      - 'tools/validate_growth_evidence.py'
      - 'tests/test_growth_evidence.py'
      - '.github/workflows/growth-evidence-ci.yml'
permissions:
  contents: read
jobs:
  media-integrity:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Comprobar estado de evidencia y publicaciones
        run: python -m unittest tests.test_growth_evidence -v
      - name: Resumen de investigación y calendario
        run: python -m tools.validate_growth_evidence
